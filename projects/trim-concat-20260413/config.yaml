# 项目配置 — 裁头拼接 模板
# 创建时间: 2026-04-13

template: "trim-concat"

# 分辨率预设（auto = 自动探测第一段视频的分辨率和帧率）
preset: "auto"

# 输出质量（可选: low / medium / high）
quality: "high"

# 变量 — 按顺序填入需要拼接的视频，每段将自动剪去开头 2 秒
variables:

  # 第 1 段视频 [video] (必填)
  clip_1: "../../input/kling_20260410_作品_固定镜头_展示穿搭_4455_0.mp4"

  # 第 2 段视频 [video]
  clip_2: "../../input/kling_20260410_作品_固定镜头_模仿穿搭博_4166_0.mp4"

  # 第 3 段视频 [video]
  clip_3: "../../input/kling_20260410_作品_固定镜头_模仿穿搭博_4505_0.mp4"

  # 第 4 段视频 [video]（留空则跳过）
