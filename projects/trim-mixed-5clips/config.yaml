# 项目配置 — 混合转场拼接 模板
# 创建时间: 2026-04-15T10:16:56.047Z

template: "trim-mixed-concat"

# 分辨率预设（可选，不写则用模板默认: auto）
# preset: "auto"

# 输出质量（可选: low / medium / high，默认: high）
# quality: "high"

# 变量 — 填入你的素材和内容
variables:

  # 第 1 段视频 [video] (必填)
  clip_1: "D:/VideoCut-Wrapper/input/1.mp4"

  # 第 2 段视频 [video]
  clip_2: "D:/VideoCut-Wrapper/input/2.mp4"

  # 第 3 段视频 [video]
  clip_3: "D:/VideoCut-Wrapper/input/3.mp4"

  # 第 4 段视频 [video]
  clip_4: "D:/VideoCut-Wrapper/input/4.mp4"

  # 第 5 段视频 [video]
  clip_5: "D:/VideoCut-Wrapper/input/5.mp4"

  # 剪去开头（秒） [number]
  trim_start: 2

  # 第 1 个转场（clip1→clip2）：flash-black / dissolve / cut [select]
  transition_1: "flash-black"

  # 第 2 个转场（clip2→clip3）：flash-black / dissolve / cut [select]
  transition_2: "dissolve"

  # 第 3 个转场（clip3→clip4）：flash-black / dissolve / cut [select]
  transition_3: "flash-black"

  # 第 4 个转场（clip4→clip5）：flash-black / dissolve / cut [select]
  transition_4: "dissolve"

  # 第 5 个转场（clip5→clip6）：flash-black / dissolve / cut [select]
  transition_5: "flash-black"

  # 转场时长（秒） [number]
  transition_duration: 0.5
