# Pipeline 配置示例 — 灵活拼接，无需修改代码
# 使用方式: npx videocut render projects/pipeline-example/config.yaml
mode: pipeline

# 分辨率预设: auto（探测第一个片段）或具名预设（douyin_vertical / douyin_horizontal / ...）
preset: auto

# 输出质量: low / medium / high
quality: high

# 自定义输出文件名（可选，默认: final.mp4）
# output:
#   filename: my-output.mp4

# ─── 片段列表（不限数量）────────────────────────────────────────────────────
# 每个片段独立设置剪头/剪尾
clips:
  - src: "D:/VideoCut-Wrapper/input/1.mp4"
    trim_start: 3      # 剪去开头 3 秒
    trim_end: 0        # 保留结尾（不剪）

  - src: "D:/VideoCut-Wrapper/input/2.mp4"
    trim_start: 2
    trim_end: 1        # 同时剪去结尾 1 秒

  - src: "D:/VideoCut-Wrapper/input/3.mp4"
    trim_start: 3

  - src: "D:/VideoCut-Wrapper/input/4.mp4"
    trim_start: 1

  - src: "D:/VideoCut-Wrapper/input/5.mp4"
    trim_start: 1

# ─── 转场列表 ────────────────────────────────────────────────────────────────
# transitions[i] = 第 i 段与第 i+1 段之间的转场
# 不够的条目由 default_transition 补足
transitions:
  - type: flash-black    # 片段 1 → 片段 2
    duration: 0.5

  - type: dissolve       # 片段 2 → 片段 3
    duration: 0.8

  - type: flash-black    # 片段 3 → 片段 4
    duration: 0.4

  # 片段 4 → 片段 5 使用下方 default_transition

# ─── 默认转场（兜底）────────────────────────────────────────────────────────
default_transition:
  type: dissolve
  duration: 0.5
