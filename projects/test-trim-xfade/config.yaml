# 项目配置 — 裁头叠化拼接 模板
# 创建时间: 2026-04-14T01:39:42.303Z

template: "trim-xfade-concat"

# 分辨率预设（可选，不写则用模板默认: auto）
# preset: "auto"

# 输出质量（可选: low / medium / high，默认: high）
# quality: "high"

# 变量 — 填入你的素材和内容
variables:

  # 第 1 段视频 [video] (必填)
  clip_1: "../../input/1.mp4"

  # 第 2 段视频 [video]
  clip_2: "../../input/2.mp4"

  # 第 3 段视频 [video]
  clip_3: "../../input/3.mp4"

  # 裁去开头（秒） [number]
  trim_start: 2

  # 叠化时长（秒） [number]
  transition_duration: 0.5
