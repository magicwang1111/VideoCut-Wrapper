services:
  videocut:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-magicwang/pytorch-base:torch210-cu128-runtime-v1}
        IMAGE_VERSION: ${IMAGE_TAG:-latest}
        IMAGE_DESCRIPTION: ${IMAGE_DESCRIPTION:-VideoCut Wrapper image}
    image: videocut-wrapper:${IMAGE_TAG:-latest}
    container_name: videocut-wrapper
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/srv/videocut/data
      - ./temp:/srv/videocut/temp
      - ./input/bgm:/app/input/bgm
      - ./input/bgm-backup:/app/input/bgm-backup
      - ./input/bgm-templete:/app/input/bgm-templete
      - ./input/bgm-avatar:/app/input/bgm-avatar
      - ./output:/app/output
      - ./pipelines:/app/pipelines:ro
      - ./fonts:/app/fonts:ro
      - ./oss-local:/srv/videocut/oss-local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, urllib.request; port = os.getenv('PORT', '3000'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3).getcode() == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
